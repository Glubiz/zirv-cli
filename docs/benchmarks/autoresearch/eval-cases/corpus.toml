# One task per `zirv benchmark eval` case (src/commands/benchmark/eval/cases/); the task id is the case id.
# Keep in step with that directory: a case missing here is never scored by the eval-behaviour campaign.

schema = 1
version = "1"

[[task]]
id = "skill-load-via-shell"
family = "eval-behaviour"
class = "bounded"
split = "dev"
kind = "eval"

