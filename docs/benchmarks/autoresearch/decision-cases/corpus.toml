# Intake decision-case corpus (issue #803).
#
# Same format as ../../wrapped-vs-vanilla/corpus.toml: every case in
# inputs.jsonl/labels.jsonl appears here exactly once, family="intake",
# kind="decision" (graded by decision_trial.py, not run.py). class reuses
# wrapped-vs-vanilla's class enum (ambiguous/sensitive fit best here); tags
# (in labels.jsonl, not here) are the finer #803 axis: ambiguous,
# misleading_metadata, insufficient_facts, costly_error -- every tag is
# represented in every split.

schema = 1
version = "1"

[[task]]
id = "ic001"
family = "intake"
class = "ambiguous"
split = "dev"
kind = "decision"

