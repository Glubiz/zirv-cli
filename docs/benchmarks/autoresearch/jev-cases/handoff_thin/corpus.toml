# Confirmatory round (conf-085, probe confidence floor 0.85 against the
# compiled 0.9): conf-085 improved both stability and correctness on
# validation in two separate runs, but the 5-case validation split left the
# gate's CI lower bound at 0. Measured bands: tiny handoffs answer "thin" at
# confidence 0.82-0.95, small ones at 0.3-0.9 (unstable -- kept `ambiguous`
# here), medium ones answer adequate/thin at <=0.44 (well under either
# floor, so `keep` either way). ht-025..040 add 8 tiny (task_len 5-30, zero
# constraints -> demote), 5 small (task_len 30-90, some constraints ->
# keep), and 3 medium/rich controls (keep), 10 validation / 6 holdout, to
# give the gate enough validation-stage evidence.

