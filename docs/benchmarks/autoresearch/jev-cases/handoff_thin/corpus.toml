# Jev determinism probe corpus for floor site "handoff_select", round 2 --
# handoff-thin ONLY (docs/superpowers work: jev-determinism campaigns).
# Round 1 (jev-cases/handoff_select/) mixed handoff-thin and handoff-select
# cases and found tiny handoff-thin facts rows answering "thin" at
# confidence 0.82-0.95, medium rows at 0.0-0.37, and rich rows "adequate" --
# but never sampled the INTERMEDIATE facts space (task_len 80-180) that sits
# between those two clusters. This corpus fills that gap: every split
# sweeps tiny/small/intermediate/medium/rich task_len buckets, plus a few
# rows with blocked>0 or files_modified 0-vs-many at matched text lengths,
# so a later confidence-floor pick can see whether intermediate handoffs
# land in the 0.4-0.8 gap between the two round-1 clusters.
#
# Every case in cases.jsonl/labels.jsonl appears here exactly once; graded
# by jev_probe_trial.py, not decision_trial.py.

