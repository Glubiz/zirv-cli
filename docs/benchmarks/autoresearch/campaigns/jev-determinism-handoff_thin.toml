# jev-determinism-handoff_thin: ROUND 2, focused solely on handoff-thin's
# confidence floor (ZIRV_CTX_JEV_FLOOR_HANDOFF_SELECT_MIN_CONFIDENCE) --
# round 1 (jev-determinism-handoff_select.toml) mixed handoff-thin and
# handoff-select cases and swept the MARGIN floor plus one confidence
# point; this campaign isolates confidence against a handoff-thin-only
# corpus (jev-cases/handoff_thin/) that also fills round 1's untested
# intermediate facts gap (task_len 80-180), so a floor pick can be made
# with intermediate-range evidence in hand. The corpus holds ONLY
# handoff-thin cases, so sweeping this key here only moves the thin site's
# floor even though production shares the same env var / floor_site with
# handoff-select -- a win here says nothing about handoff-select's own
# tradeoff, which stays round 1's job.
#
# Measures per-site DETERMINISM (`quality` = acted-decision stability
# across K uncached repetitions of the same case, via jev_probe_trial.py
# --reps 10) alongside `correctness` (agreement with each item's labelled
# expected action). Backend drives the real `zirv ctx jev probe` verb --
# this campaign spends real money (every trial is `calls_per_trial` live
# Jev decision calls) and is NEVER run in CI. `[criteria] objective =
# "quality"` promotes a candidate on a material STABILITY win (a higher
# floor trades Jev influence for stability -- this is the axis this
# campaign exists to measure), not on cost/wall as the default
# "efficiency" objective would.
#
# handoff-thin writes its own receipt ("jev:handoff"), distinct from
# handoff-select's ("jev:handoff_select") despite sharing one floor_site/
# env var -- this corpus is handoff-thin only, so a single requires_receipts
# entry covers every case in it.
#
# CONFIRMATORY ROUND: conf-085 (0.85 against the compiled 0.9) improved both
# stability and correctness on validation in two separate round-2 runs, but
# the bootstrap CI lower bound stayed at 0 with only 10 validation cases --
# not enough evidence to promote. conf-045, conf-060, and conf-082 were
# already rejected in round 2 on correctness or stability grounds and are
# NOT re-run here (see docs/benchmarks/autoresearch/results/ for that
# report). jev-cases/handoff_thin/ now carries 16 more cases (ht-025..040,
# 10 validation / 6 holdout): 8 tiny (task_len 5-30, zero constraints,
# measured "thin" at confidence 0.82-0.95 -> demote), 5 small (task_len
# 30-90 with some constraints, measured 0.3-0.9 -> unstable, kept
# `ambiguous`, labelled `keep`), and 3 medium/rich controls (measured
# adequate/thin at <=0.44, well under either floor -> keep). This campaign
# now runs ONLY conf-085.
#
# Pair counts: validate = 20 tasks * 2 reps = 40 pairs, holdout = 12 tasks *
# 2 reps = 24 pairs, both >= criteria.min_pairs = 6.

schema = 1
id = "jev-determinism-handoff_thin"
description = "Round 2: sweep ZIRV_CTX_JEV_FLOOR_HANDOFF_SELECT_MIN_CONFIDENCE for determinism (stability) against jev-cases/handoff_thin, a handoff-thin-only corpus filling round 1's untested intermediate facts gap. Costs real money; not run in CI."
runtime = "meta"
seat_mode = "single"
cache_mode = "cold"
billing = "metered"

[baseline]
commit = "HEAD"

[evaluator]
version = "1"
protected = ["docs/benchmarks/autoresearch/jev-cases/handoff_thin/cases.jsonl", "docs/benchmarks/autoresearch/jev-cases/handoff_thin/labels.jsonl", "docs/benchmarks/autoresearch/jev-cases/handoff_thin/corpus.toml", "docs/benchmarks/autoresearch/jev_probe_trial.py"]
self_check = []

[corpus]
file = "docs/benchmarks/autoresearch/jev-cases/handoff_thin/corpus.toml"

[backend]
kind = "command"
command = ["python", "docs/benchmarks/autoresearch/jev_probe_trial.py", "--trial", "{spec}", "--out", "{out}", "--reps", "10"]
per_trial_ceiling_usd = 0.001
calls_per_trial = 10
timeout_secs = 180

[route]
harness = "claude"
model = "sonnet"

[budgets]
# Worst case with 1 candidate and the grown corpus (dev 8, validation 20,
# holdout 12): screen 8*2=16, validate 20*3=60, holdout 12*3=36 -> baseline
# 112; candidate_worst_case = 1*(16+60)+36 = 112 -> worst_case_trials = 224,
# worst_case_calls = 224*10 = 2240, worst_case_spend = 224*0.0015 = $0.336.
max_spend_usd = 0.45
max_wall_secs = 14400
max_calls = 4200
max_trials = 420
max_retries = 1
concurrency = 3

[stages.screen]
split = "dev"
reps = 2

# Pre-registered after the n=60 confirmatory run (d_quality +0.028, CI lower
# 0.0083 just below min_effect 0.01): validate and holdout reps doubled to 6,
# criteria unchanged; the gate's verdict on this run is final.
[stages.validate]
split = "validation"
reps = 6

[stages.holdout]
split = "holdout"
reps = 6
max_uses = 1

[criteria]
objective = "quality"
min_pairs = 6
correctness_floor = 0.0
quality_floor = 0.0
max_correctness_regression = 0.05
max_quality_regression = 0.02
min_effect = 0.01
confidence = 0.9
bootstrap_resamples = 2000

[cohort]
pressure = "natural"
env = {}

[candidate_space]
allow_env = ["ZIRV_CTX_JEV_FLOOR_HANDOFF_SELECT_MIN_CONFIDENCE"]
allowed_models = ["sonnet"]

# Only conf-085 survives into this confirmatory round: conf-045/060/082
# were already rejected in round 2 (correctness or stability), so they are
# not re-run here.
[[candidates]]
id = "conf-085"
hypothesis = "A 0.85 floor probes the lower edge of the tiny-handoff band (0.84-0.95); expected to flip more than 0.82 (control for the gap's position)."
mechanism = "ZIRV_CTX_JEV_FLOOR_HANDOFF_SELECT_MIN_CONFIDENCE=0.85, margin left at the compiled default."
env = { ZIRV_CTX_JEV_FLOOR_HANDOFF_SELECT_MIN_CONFIDENCE = "0.85" }
requires_receipts = ["jev:handoff"]
