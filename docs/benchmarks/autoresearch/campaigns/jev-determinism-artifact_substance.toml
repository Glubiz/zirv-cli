# jev-determinism-artifact_substance: sweeps the probe-only measurement floor
# (ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE/ZIRV_CTX_JEV_PROBE_MIN_MARGIN) against
# the labelled jev-cases/artifact_substance/ corpus, measuring per-site DETERMINISM
# (`quality` = acted-decision stability across K uncached repetitions of the
# same case, via jev_probe_trial.py --reps 5) alongside `correctness`
# (agreement with each item's labelled expected action). Backend drives the
# real `zirv ctx jev probe` verb (probe-contract extension, the 12 sites
# added alongside the original 12) -- this campaign spends real money (every
# trial is `calls_per_trial` live Jev decision calls) and is NEVER run in
# CI. `[criteria] objective = "quality"` promotes a candidate on a material
# STABILITY win (a higher floor trades Jev influence for stability -- this
# is the axis this campaign exists to measure), not on cost/wall as the
# default "efficiency" objective would.
#
# Unlike the original 12 sites' own `ZIRV_CTX_JEV_FLOOR_<SITE>_*` env, this
# site has no per-site tunable production floor env at all: its compiled
# floor (0.9, 0.2) only ever changes via a reviewed source
# edit. `ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE`/`_MIN_MARGIN` are measurement-only
# overrides `zirv ctx jev probe` reads for ANY site under measurement; they
# are never read by production.
#
# SAFETY SITE: any floor change actually shipped from evidence this campaign
# produces may only move the floor in the CONSERVATIVE direction (more
# fallback, i.e. tighter/more-cautious) -- and only ever as a reviewed source
# edit to the compiled const itself, never by shipping an env override. The
# ZIRV_CTX_JEV_PROBE_MIN_* keys below are measurement-only (read solely by
# `zirv ctx jev probe`); production never reads them, so this campaign can
# never itself change what production does.
#
# Pair counts: validate = 5 tasks * 2 reps = 10 pairs, holdout = 3 tasks *
# 2 reps = 6 pairs, both >= criteria.min_pairs = 6.

schema = 1
id = "jev-determinism-artifact_substance"
description = "Sweep ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE/ZIRV_CTX_JEV_PROBE_MIN_MARGIN for determinism (stability) against jev-cases/artifact_substance. Costs real money; not run in CI."
runtime = "meta"
seat_mode = "single"
cache_mode = "cold"
billing = "metered"

[baseline]
commit = "HEAD"

[evaluator]
version = "1"
protected = ["docs/benchmarks/autoresearch/jev-cases/artifact_substance/cases.jsonl", "docs/benchmarks/autoresearch/jev-cases/artifact_substance/labels.jsonl", "docs/benchmarks/autoresearch/jev-cases/artifact_substance/corpus.toml", "docs/benchmarks/autoresearch/jev_probe_trial.py"]
self_check = []

[corpus]
file = "docs/benchmarks/autoresearch/jev-cases/artifact_substance/corpus.toml"

[backend]
kind = "command"
command = ["python", "docs/benchmarks/autoresearch/jev_probe_trial.py", "--trial", "{spec}", "--out", "{out}", "--reps", "5"]
per_trial_ceiling_usd = 0.001
calls_per_trial = 5
timeout_secs = 180

[route]
harness = "claude"
model = "sonnet"

[budgets]
max_spend_usd = 0.05
max_wall_secs = 3600
max_calls = 250
max_trials = 50
max_retries = 1
concurrency = 3

[stages.screen]
split = "dev"
reps = 2

[stages.validate]
split = "validation"
reps = 3

[stages.holdout]
split = "holdout"
reps = 3
max_uses = 1

[criteria]
objective = "quality"
min_pairs = 6
correctness_floor = 0.0
quality_floor = 0.0
max_correctness_regression = 0.05
max_quality_regression = 0.02
min_effect = 0.01
confidence = 0.9
bootstrap_resamples = 2000

[cohort]
pressure = "natural"
env = {}

[candidate_space]
allow_env = ["ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE", "ZIRV_CTX_JEV_PROBE_MIN_MARGIN"]
allowed_models = ["sonnet"]

[[candidates]]
id = "margin-010"
hypothesis = "A much lower margin floor (artifact_substance) trades away stability for more decisive Jev answers."
mechanism = "ZIRV_CTX_JEV_PROBE_MIN_MARGIN=0.10, confidence left at the compiled default."
env = { ZIRV_CTX_JEV_PROBE_MIN_MARGIN = "0.10" }
requires_receipts = ["jev:workflow-artifact-substance"]

[[candidates]]
id = "margin-030"
hypothesis = "A moderately higher margin floor (artifact_substance) buys some stability without much lost coverage."
mechanism = "ZIRV_CTX_JEV_PROBE_MIN_MARGIN=0.30, confidence left at the compiled default."
env = { ZIRV_CTX_JEV_PROBE_MIN_MARGIN = "0.30" }
requires_receipts = ["jev:workflow-artifact-substance"]

[[candidates]]
id = "margin-040"
hypothesis = "A high margin floor (artifact_substance) maximizes stability at the cost of coverage/correctness."
mechanism = "ZIRV_CTX_JEV_PROBE_MIN_MARGIN=0.40, confidence left at the compiled default."
env = { ZIRV_CTX_JEV_PROBE_MIN_MARGIN = "0.40" }
requires_receipts = ["jev:workflow-artifact-substance"]

[[candidates]]
id = "confidence-raised"
hypothesis = "Raising the measurement confidence floor (artifact_substance) above its compiled default (0.9) improves stability without an unacceptable correctness cost."
mechanism = "ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE=0.95, margin left at the compiled default."
env = { ZIRV_CTX_JEV_PROBE_MIN_CONFIDENCE = "0.95" }
requires_receipts = ["jev:workflow-artifact-substance"]
