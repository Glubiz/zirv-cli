# eval-behaviour: uses `zirv benchmark eval run --trial-dir` as the command backend, so a
# proposed source patch to the shipped instructions (prompt layers, skills, MCP tool
# descriptions, safety messages) is scored by the behaviour eval corpus. A trial is one corpus
# task = one eval case, 2 samples; `correctness` = 1.0 when the case passes, else 0.0.
# Every trial is a real headless harness launch and spends real model quota (never run in CI);
# `per_trial_ceiling_usd` is passed to the adapter through spec.json and caps its spend.
# The eval resolves surfaces from the binary under test, hence `{zirv_dir}/zirv`.

schema = 1
id = "eval-behaviour"
description = "Score a proposed instruction patch against the behaviour eval corpus. Costs real money; not run in CI."
runtime = "meta"
seat_mode = "single"
cache_mode = "cold"
billing = "metered"

[baseline]
commit = "HEAD"

[evaluator]
version = "1"
protected = ["docs/benchmarks/autoresearch/eval-cases/corpus.toml", "src/commands/benchmark/eval/**"]
self_check = ["zirv", "benchmark", "eval", "lint"]

[corpus]
file = "docs/benchmarks/autoresearch/eval-cases/corpus.toml"

[backend]
kind = "command"
command = ["{zirv_dir}/zirv", "benchmark", "eval", "run", "--yes", "--samples", "2", "--trial-dir", "{out}"]
per_trial_ceiling_usd = 0.30
calls_per_trial = 2
timeout_secs = 600

[route]
harness = "claude"
model = "sonnet"

[budgets]
max_spend_usd = 20.00
max_wall_secs = 7200
max_calls = 400
max_trials = 60
max_retries = 1
concurrency = 2

[stages.screen]
split = "dev"
reps = 2

[stages.validate]
split = "validation"
reps = 2

[stages.holdout]
split = "holdout"
reps = 2
max_uses = 1

[criteria]
min_pairs = 6
correctness_floor = 0.0
quality_floor = 0.0
max_correctness_regression = 0.0
max_quality_regression = 0.0
min_effect = 0.01
confidence = 0.9
bootstrap_resamples = 2000

[candidate_space]
allowed_models = ["sonnet"]

[candidate_space.source_patch]
allowed_paths = ["src/commands/ctx/prompt.rs", "src/commands/workflow/skills/**"]
build = ["cargo", "build", "--release"]
bin_dir = "target/release"

[proposer]
harness = "claude"
model = "sonnet"
max_proposals = 3
per_call_ceiling_usd = 0.50
