# wrapped-vs-vanilla task corpus (issue #801).
#
# Every task directory under tasks/ must appear here exactly once. `split`
# partitions tasks by GROUP so near-duplicates never straddle a split
# boundary: t24_long_haul and t24b_long_haul are byte-identical except for
# two step prompts (see tasks/README.md's "t24b_long_haul" note), so both
# sit in `holdout` together -- using one for screening and the other as the
# "unseen" holdout would leak almost the whole task into iterative candidate
# selection. `dev` is the cheap small-task set used for autoresearch
# screening (#802); `dev`/`validation`/`holdout` each cover several `class`
# values and each carries at least one `long_session` chain task (dev:
# t23_afternoon; validation: t25_sticky_notes; holdout: t24_long_haul +
# t24b_long_haul) so a `[stages.*] classes = ["long_session"]` filter has
# something to screen/validate/holdout against on every stage, per #801's
# evaluation contract. See CONTRACT.md's "Task corpus and splits" section
# for the full rule this file follows.
#
# Today there is exactly one project family (`ledgerlite`); every report
# built from this corpus must flag `single_family` per the design spec's
# non-goals ("no new benchmark project families").

schema = 1
version = "1"

[[task]]
id = "t01_tiebreak"
family = "ledgerlite"
class = "bounded"
split = "dev"
kind = "answer"

