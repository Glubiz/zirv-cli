# Orchestration lane (orch.py). o01_ledger_suite is ONE request combining five
# validation/holdout feature tasks (t17, t20, t22, t21, t19), so it reuses their
# hidden suites; it gets its own `orch` split (and `orchestration` class) rather
# than straddling validation and holdout, and no autoresearch stage selects it
# unless a manifest asks for split = "orch".
[[task]]
id = "o01_ledger_suite"
