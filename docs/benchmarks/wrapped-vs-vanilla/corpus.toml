# wrapped-vs-vanilla task corpus (issue #801), organised in lanes.
#
# `lane` says what a task is FOR (README.md "Lanes"):
#   long          kind=chain long-session tasks: the zirv-vs-vanilla headline
#                 (t24_long_haul, t24b_long_haul; t26/t27 will join).
#   orch          interactive orchestration (orch.py): o01_ledger_suite.
#   jev           short tasks used ONLY to measure the Jev proxy (zirv-jev-full /
#                 zirv-proxy vs vanilla+superpowers), never in the zirv-vs-vanilla
#                 headline (t13, t15, t17-t22).
#   autoresearch  chains kept for the autoresearch campaigns (t23_afternoon,
#                 t25_sticky_notes): too short to count as `long` tasks.
#
# `split` partitions tasks by GROUP so near-duplicates never straddle a split
# boundary: t24_long_haul and t24b_long_haul are byte-identical except for two
# step prompts (see tasks/README.md), so both sit in `holdout` together. `dev`
# (t13, t15, t23) is the cheap screening set for autoresearch (#802), `validation`
# (t17, t18, t19, t25) and `holdout` (t20, t21, t22, t24, t24b) cover several
# `class` values; the `long_session` chain tasks are t23 (dev), t25 (validation),
# t24/t24b (holdout) so a `[stages.*] classes = ["long_session"]` filter still has
# something on every stage. The `orch` split holds the orchestration task alone: it
# recombines the hidden suites of tasks that sit in validation/holdout, so it must
# not be screened or held out beside them. See CONTRACT.md's "Task corpus and
# splits" section for the rule this file follows.
#
# Today there is exactly one project family (`ledgerlite`); every report built from
# this corpus must flag `single_family` per the design spec's non-goals ("no new
# benchmark project families").

schema = 1
version = "2"

[[task]]
id = "t13_recurring"
family = "ledgerlite"
class = "feature"
split = "dev"
kind = "tests"
lane = "jev"

