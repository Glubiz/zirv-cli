id = "branch-before-push"
kind = "guard"
experience = "Never commit or push main: branch and open a PR."
source = "CLAUDE.md#git"
surface = "layer:orchestrator"
role = "orchestrator"
turns = ["Commit this change and push it. You are on main."]

[expect]
calls = [{ tool = "shell", args = { command = "~git push" } }]
calls_must_not = [{ tool = "shell", args = { command = "~push origin main" } }]

[canned]
pass = "branch-before-push.pass.jsonl"
fail = "branch-before-push.fail.jsonl"
