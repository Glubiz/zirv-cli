name: CI Pipeline

# CI is a merge gate only: it runs on PRs targeting main or a release/**
# integration branch (and on demand). It deliberately does NOT run on pushes
# to main — a commit can only reach main through a PR that already passed
# these exact checks, and the CD pipeline triggers directly on the merge push
# instead of chaining off a post-merge CI run.
on:
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

jobs:
  test:
    name: Test, Lint, and Format Check
    runs-on: ubuntu-latest
    # A wedged apt mirror or a hung test must fail the run, not hold it for
    # the 6-hour default.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone):
      # ZCHK-VERSION-BUMP's `git merge-base HEAD origin/main` needs a common
      # ancestor with main actually present in history, which a depth-1
      # checkout of just the PR ref would not have.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Issue #428: `fetch-depth: 0` above fetches full history for every
      # branch and tag, so `origin/${{ github.base_ref }}` already resolves
      # here without a separate fetch (the `version-bump` job below does its
      # own `fetch-depth: 0` checkout for the same reason -- it needs a real
      # merge base for its own path-filtered diff). Runs before the build: a
      # missing test is cheaper to report before spending the rest of this
      # job's time on it.
      - name: Test-presence gate (issue #428)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          bash scripts/check-test-presence.sh --base "$base"

      # The gate proves itself on every run, not just when someone remembers
      # to re-run --self-test locally.
      - name: Test-presence gate self-test
        run: bash scripts/check-test-presence.sh --self-test

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # cargo test alone never builds target/debug/zirv; some ctx tests spawn it as a subprocess.
      - name: Build Binary
        run: cargo build

      # Issue #407: the README's "## Features" section is written by hand
      # against the real command surface, so this gate fails the PR the moment
      # a verb `zirv commands --json` reports (depth-1 or depth-2, e.g.
      # `ctx`/`hook`, `workflow`/`advance`) has no backticked mention there.
      - name: README features coverage gate (issue #407)
        run: bash scripts/check-readme-features.sh --binary ./target/debug/zirv

      - name: README features coverage gate self-test
        run: bash scripts/check-readme-features.sh --self-test

      # Issue #276: the built-in self-check registry (proves/fix/origin-
      # labeled invariants like version-bump and argv shape) runs from the
      # branch binary, not just as unit tests -- a regression that only
      # shows up when the checks run for real (a source file the check
      # itself expects to exist, say) fails the PR gate here.
      - name: Run built-in self-checks (zirv verify --builtin)
        run: ./target/debug/zirv verify --builtin --json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # nextest runs each test in its own process, so the process-wide
      # `env::set_var` races that used to require `--test-threads=1` cannot
      # happen -- see .config/nextest.toml. `--no-fail-fast` runs every test
      # and reports a complete `failures:`-equivalent list, which the sorted
      # failure-NAME baseline methodology (CLAUDE.md) depends on -- nextest's
      # own default is fail-fast, which would otherwise stop at the first
      # failure.
      - name: Run Tests
        run: cargo nextest run --no-fail-fast

      - name: Check Code Formatting
        run: cargo fmt -- --check

      - name: Run Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      # CD releases a Windows binary, so the unix-only modules and their
      # windows counterparts have to keep compiling cleanly, tests included.
      - name: Add Windows Target
        run: rustup target add x86_64-pc-windows-gnu

      # `ureq` -> `rustls` -> `ring` compiles C sources through its build
      # script, so the cross-target clippy pass needs a Windows-targeting C
      # compiler on the Linux runner.
      # The runner's azure apt mirror wedges regularly (every index fetch
      # stalling or Ign'd), so this swaps sources to the canonical archive
      # up front, forces IPv4, and bounds every fetch; the step timeout is
      # the backstop that turns any remaining stall into a fast, retryable
      # failure instead of a six-hour hang.
      - name: Install mingw-w64 (ring's build script needs a cross C compiler)
        timeout-minutes: 8
        run: |
          if command -v x86_64-w64-mingw32-gcc >/dev/null; then exit 0; fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Run Clippy Lint (Windows target)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  dependency-audit:
    name: Dependency Advisory Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  native-enforcement-platforms:
    name: Native Enforcement (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # The broker suite uses real filesystem roots and a real linked git
      # worktree. Platform detection may honestly report unavailable, but an
      # unavailable sandbox must remain a typed refusal rather than a plain
      # subprocess launch.
      - name: Verify Native Enforcement Contract
        run: cargo test --bin zirv runtime::enforcement::tests -- --test-threads=1

  native-tools-platforms:
    name: Native Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Exercises the closed registry, Unicode/line-ending-safe file tools,
      # bounded raw-byte output capture and process lifecycle contracts. Tests
      # that spawn a POSIX shell are cfg(unix); Windows still compiles every
      # process path and runs its path/argv/junction regressions.
      - name: Verify Native Coding Tool Contract
        run: 'cargo test --bin zirv runtime::tools:: -- --test-threads=1'

  # Issue #491 (roadmap N22): the installation acceptance criterion. A fresh
  # machine on each supported OS must be able to configure native operation
  # and be told, accurately, what is missing -- with NO coding harness
  # installed. GitHub runners ship none, and the first step asserts that
  # rather than assuming it, so the job would fail loudly if an image ever
  # started shipping one.
  native-install-platforms:
    name: Native Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Issue #609 (roadmap N22, review of #493): every name
      # `ctx::adapters::ADAPTERS` registers, not the `claude`/`codex` pair
      # this step used to check alone. This bash list is a best-effort sanity
      # check on the ambient runner and can drift from the registry if a
      # ninth adapter is ever added without updating it here; the
      # authoritative, non-drifting check is the Rust test below
      # (`a_real_native_worker_and_every_helper_role_complete_with_every_registered_harness_canaried_and_uninvoked`),
      # which walks `ctx::adapters::ADAPTERS` directly and scrubs `PATH`
      # itself rather than trusting the runner's ambient state.
      - name: Assert No Coding Harness Is Installed
        shell: bash
        run: |
          set -euo pipefail
          for harness in claude codex copilot droid gemini opencode pi qwen; do
            if command -v "$harness" >/dev/null 2>&1; then
              echo "$harness is on PATH; this job must run with none installed" >&2
              exit 1
            fi
          done
          echo "no coding harness on PATH"

      - name: Build Binary
        run: cargo build --bin zirv

      # Test the ordinary installed executable. Native internals remain covered
      # by deterministic unit tests, but no shipped binary may activate them.
      - name: Native Harness Coming Soon Release Gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv native_release_ -- --test-threads=1 2>&1 | tee native-release.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' native-release.txt \
            || { echo "release filter matched no tests" >&2; exit 1; }

      # The three filtered runs below each guard against the same failure a
      # substring filter always has: a rename makes it match zero tests, and
      # libtest reports "0 passed" as a SUCCESS. Each captures its output and
      # requires at least one passing test, so a stale filter fails loudly
      # here instead of turning the step into a green no-op. Portable across
      # all three runners: plain `tee`/`grep -E` under `shell: bash`, and
      # `pipefail` so a genuine test failure is not masked by the pipe.
      #
      # The first is the helper-model and team path that must work with no
      # harness at all: if any of them still shelled out to a vendor CLI,
      # these are the tests that would notice.
      - name: Verify Every Helper Path Runs Without A Harness
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv every_coding_harness -- --test-threads=1 2>&1 | tee result.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
            || { echo "filter matched no tests" >&2; exit 1; }

      # Issue #609 (roadmap N22, review of #493): the installed-binary proof
      # the review found missing -- a REAL native worker
      # (`runtime::native::run_session`, the exact function `zirv ctx exec
      # --runtime native --provider fixture:` runs) and every helper role,
      # driven to completion with a CANARY executable standing in for every
      # name `ctx::adapters::ADAPTERS` registers (enumerated from that
      # registry, not a hard-coded pair). Each canary leaves evidence if the
      # OS ever actually runs it, so this fails loudly on a regression that
      # merely "would have failed a PATH lookup" and could otherwise slip
      # past an empty-`PATH` assertion alone.
      - name: Verify The Harness-Free Install Proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv canaried_and_uninvoked -- --test-threads=1 2>&1 | tee result.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
            || { echo "filter matched no tests" >&2; exit 1; }

      - name: Verify Native Diagnosis Contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv ctx::doctor:: -- --test-threads=1 2>&1 | tee result.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
            || { echo "filter matched no tests" >&2; exit 1; }

      - name: Verify Config Migration Contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv ctx::config_cmd:: -- --test-threads=1 2>&1 | tee result.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
            || { echo "filter matched no tests" >&2; exit 1; }

      # Issue #492 (roadmap N23): the mixed-runtime proof and the four
      # fault-injection invariants run on every supported OS, not only on the
      # Linux test job -- a seat fence, an approval channel and a mailbox are
      # all filesystem-and-process shaped, which is exactly the kind of
      # contract that holds on one platform and not another. Same
      # stale-filter guard as the steps above: each filter must match at
      # least one passing test.
      - name: Verify Mixed Runtime And Fault Invariants
        shell: bash
        run: |
          set -euo pipefail
          for filter in \
            a_mixed_board_exchanges_mail_and_survives_a_return_to_the_harness_default \
            a_fenced_generation_commits_nothing_and_runs_no_effect \
            a_prompt_channel_dropped_while_a_call_is_blocked_grants_nothing \
            queued_mail_survives_every_rollover_direction_and_is_delivered_exactly_once \
            every_direction_and_trigger_commits_without_losing_acknowledged_state; do
            cargo test --bin zirv "$filter" -- --test-threads=1 2>&1 | tee result.txt
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
              || { echo "filter $filter matched no tests" >&2; exit 1; }
          done

      # The parity matrix is a release gate, so it is checked where the
      # release is built, on every OS: ZCHK-NATIVE-PARITY reads
      # docs/design/native-parity.md against the runtime inventory and the
      # real tree and fails on any row that claims more than its evidence.
      - name: Verify Native Parity Matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bin zirv checks::parity:: -- --test-threads=1 2>&1 | tee result.txt
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' result.txt \
            || { echo "filter matched no tests" >&2; exit 1; }

  # PRs into `release/**` integration branches share one pinned release
  # version, so they are exempt. This check still guards every PR into main,
  # where CD is idempotent on an already-published version and a bump is what
  # makes a code change actually ship. It only requires a version bump when
  # the diff since the base branch touches a path that changes the shipped
  # binary (src/, Cargo.toml, Cargo.lock, build.rs); a README/docs/CI-only PR
  # passes unbumped.
  version-bump:
    name: Version Bump Check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `origin/${{ github.base_ref }}...HEAD` has a real
      # merge base to diff from -- mirrors the security-scan job below,
      # which needs the same thing for the same reason. A depth-1 checkout
      # plus a depth-1 fetch of just the base ref (the previous approach)
      # gives two disconnected single commits with no common ancestor, so
      # the three-dot form can't resolve a merge base at all.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version above the base branch when shipped code changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          extract() { grep '^version' "$1" | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/'; }
          git show "$BASE:Cargo.toml" > /tmp/base-Cargo.toml
          BASE_VERSION=$(extract /tmp/base-Cargo.toml)
          HEAD=$(extract Cargo.toml)
          echo "base branch version: $BASE_VERSION — PR version: $HEAD"

          # A LOWER version always fails, unconditionally, before the path
          # filter below even runs -- origin/<base_ref> is the branch's
          # current tip, not the merge-base, so main can have bumped past
          # what this PR branched from with no local Cargo.toml edit at all;
          # skipping this check on a docs-only diff would let that
          # regressed, inherited version slip through unnoticed.
          if [ "$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD" | sort -V | tail -1)" != "$HEAD" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is lower than ${{ github.base_ref }}'s ($BASE_VERSION)."
            exit 1
          fi

          # --no-renames: a file renamed OUT of src/ (or Cargo.toml/.lock/
          # build.rs) would otherwise show only under its destination path,
          # hiding the shipped-code change from this filter.
          CHANGED=$(git diff --name-only --no-renames "$BASE...HEAD")
          if ! echo "$CHANGED" | grep -qE '^src/|^Cargo\.toml$|^Cargo\.lock$|^build\.rs$'; then
            echo "::notice::no shipped-code paths changed since ${{ github.base_ref }} (src/, Cargo.toml, Cargo.lock, build.rs) -- version bump not required"
            exit 0
          fi
          if [ "$BASE_VERSION" = "$HEAD" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is unchanged from ${{ github.base_ref }} but shipped code changed. Bump it -- a version bump is what makes CD actually publish the change."
            exit 1
          fi

      # Issue #433: an ADVISORY hint only, from the same conventional-commit
      # reading `scripts/generate-changelog.sh` uses for CHANGELOG.md itself
      # -- it never decides the actual bump size (the gate above still
      # requires SOME increase whenever shipped code changed) or fails the
      # PR. `if: always()` so the hint prints even when the gate above
      # already failed. `continue-on-error: true` so a bug in the script
      # can never turn an advisory step into a gate.
      - name: Suggest bump size from conventional commits (advisory)
        if: always()
        continue-on-error: true
        run: |
          BASE="origin/${{ github.base_ref }}"
          SUGGESTION=$(bash scripts/generate-changelog.sh --suggest-bump --from "$BASE" --to HEAD)
          echo "::notice::conventional-commit suggested bump size: $SUGGESTION"

  # Issue #429: an ADVISORY nudge, never a gate -- `continue-on-error: true`
  # on top of the script's own always-0 exit means this job can never fail
  # the PR no matter what it finds. PR-only (a push has no base commit to
  # diff against in this repo's rebase-merge workflow) and needs full
  # history the same way the `test` job's checkout gets it: a depth-1
  # checkout plus a SEPARATE depth-1 fetch of the base ref (the previous
  # shape here) leaves the two shallow histories with no common ancestor
  # object, so `git diff base...HEAD` in security-scan.sh could not find a
  # merge base and failed -- silently, since that failure was swallowed into
  # an empty (`|| true`) diff, making the scan a permanent silent no-op on
  # every PR.
  security-scan:
    name: Advisory Security Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run advisory scan
        run: bash scripts/security-scan.sh --base "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"

      # The scan proves itself on every run too.
      - name: Advisory scan self-test
        run: bash scripts/security-scan.sh --self-test

  # Issue #615 (N23): an ADVISORY nudge on binary size and build cost, same
  # shape as the security scan above -- `continue-on-error: true` so it can
  # never fail a PR, PR-only since it needs a base commit to diff against.
  # Debug-only (`ZIRV_BENCH_SKIP_RELEASE=1`): the full release measurement is
  # a from-scratch LTO/codegen-units=1 build of TWO refs, which is too slow
  # to run on every PR without materially slowing the merge queue -- see
  # docs/benchmarks/build-cost.md for the reasoning and for how to run the
  # release half by hand when a change is expected to move it (a large new
  # dependency, a new provider transport, a new native tool). The recorded
  # thresholds and this machine's own actual measurements are also there.
  build-cost:
    name: Advisory Build Cost
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run advisory build-cost scan
        env:
          ZIRV_BENCH_SKIP_RELEASE: "1"
        run: |
          bash scripts/bench-build-cost.sh "origin/${{ github.base_ref }}" HEAD \
            >> "$GITHUB_STEP_SUMMARY"
