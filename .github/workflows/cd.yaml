name: CD Pipeline

permissions:
  contents: write

# CD triggers directly on the merge push to main. CI is not re-run after
# the merge: it already gated the PR, so the merge commit's push goes
# straight to release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    # Only release from main: workflow_dispatch can be invoked from any
    # ref, and an off-main run would rebuild and re-publish whatever
    # version that ref carries — failing at the release/Chocolatey step
    # on the duplicate.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
            ext: tar.gz
          - os: windows-latest
            suffix: windows
            ext: exe
          - os: macos-latest
            suffix: macos
            ext: tar.gz

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VER=$(grep '^version' Cargo.toml \
            | head -n1 \
            | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package artifact
        shell: bash
        run: |
          V=${{ steps.get_version.outputs.version }}
          SUF=${{ matrix.suffix }}
          EXT=${{ matrix.ext }}

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Rename the .exe
            mv target/release/zirv.exe zirv-${V}-windows.exe

          else
            # For macOS or Linux, produce a tarball containing 'zirv'
            if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              # Build universal for Intel & ARM
              rustup target add x86_64-apple-darwin
              rustup target add aarch64-apple-darwin
              cargo build --release --target x86_64-apple-darwin
              cargo build --release --target aarch64-apple-darwin
              lipo -create \
                target/x86_64-apple-darwin/release/zirv \
                target/aarch64-apple-darwin/release/zirv \
                -output zirv
            else
              # Linux: static musl build. The default glibc build (from
              # ubuntu-24.04) links GLIBC_2.39, which fails to run on
              # Debian 12 / Ubuntu 22.04; musl gives a static-pie binary
              # that runs everywhere.
              sudo apt-get update && sudo apt-get install -y musl-tools
              rustup target add x86_64-unknown-linux-musl
              cargo build --release --target x86_64-unknown-linux-musl
              cp target/x86_64-unknown-linux-musl/release/zirv zirv
            fi

            chmod +x zirv
            tar -czvf zirv-${V}-${SUF}.tar.gz zirv
            rm zirv
          fi

      - name: Checksum artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $artifact = "zirv-$ver-windows.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          $line = "$hash  $artifact"
          # sha256sum text format, LF-terminated -- Set-Content on Windows
          # defaults to CRLF, which sha256sum -c rejects.
          [System.IO.File]::WriteAllText("$artifact.sha256", "$line`n")

      - name: Checksum artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          V=${{ steps.get_version.outputs.version }}
          SUF=${{ matrix.suffix }}
          ARTIFACT="zirv-${V}-${SUF}.tar.gz"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zirv-${{ matrix.suffix }}
          path: |
            ${{ matrix.os == 'windows-latest' && format('zirv-{0}-windows.exe', steps.get_version.outputs.version) || format('zirv-{0}-{1}.tar.gz', steps.get_version.outputs.version, matrix.suffix) }}
            ${{ matrix.os == 'windows-latest' && format('zirv-{0}-windows.exe.sha256', steps.get_version.outputs.version) || format('zirv-{0}-{1}.tar.gz.sha256', steps.get_version.outputs.version, matrix.suffix) }}

  release:
    name: Create GitHub Release & Upload Assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ needs.build.outputs.version }}
      published: ${{ steps.release.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version
        run: echo "Version is ${{ needs.build.outputs.version }}"

      # Issue #433: a light script (not release-please -- that stages its own
      # release PR and drops the per-PR version bump this repo's linear
      # rebase-merge model relies on). Generates the one section for this
      # release from conventional commits since the previous tag and, on a
      # first run for this tag, inserts it into CHANGELOG.md (regenerated
      # only, per scripts/generate-changelog.sh's own header -- never hand-
      # edited) and commits that ahead of the tag, so the tag itself points
      # at a commit that already carries its own changelog entry.
      # `[skip ci]` stops the push below from re-triggering this same
      # workflow (native GitHub Actions support, no extra config needed).
      # The tag is pushed BEFORE the changelog commit: the tag (and the
      # release built from it) is the load-bearing artifact, the changelog
      # commit on main is cosmetic and regenerable. A failed tag push fails
      # the job cleanly with nothing touched, same as before reordering; a
      # failed changelog push is caught and logged as a warning instead,
      # since the release is already correct by that point and the next
      # release's nearest_tag lookup folds in whatever section got missed.
      # This still adds no concurrency guard against a second concurrent
      # push to main racing the changelog push -- accepted for a light
      # script, and it can no longer strand a tagless commit on main the
      # way the old order could.
      - name: Update CHANGELOG.md And Create Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.build.outputs.version }}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # No --from: the script's own nearest-tag lookup excludes HEAD
          # itself (looks at HEAD^), which matters on a re-run after a
          # previous attempt already created $TAG on HEAD -- resolving the
          # previous tag here manually would otherwise find $TAG itself and
          # produce an empty range.
          DATE=$(date -u +%Y-%m-%d)
          bash scripts/generate-changelog.sh --section --to HEAD \
            --header "## ${TAG} (${DATE})" > changelog-section.md

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists -- CHANGELOG.md not touched again"
          else
            if [ ! -f CHANGELOG.md ]; then
              bash scripts/generate-changelog.sh --print-header > CHANGELOG.md
            fi
            # Insert just before the first existing "## v..." section (or at
            # end of file when this is the very first entry after the header).
            first=$(grep -n '^## v' CHANGELOG.md | head -1 | cut -d: -f1 || true)
            first=${first:-$(($(wc -l < CHANGELOG.md) + 1))}
            {
              head -n "$((first - 1))" CHANGELOG.md
              cat changelog-section.md
              tail -n "+${first}" CHANGELOG.md
            } > changelog-new.md
            mv changelog-new.md CHANGELOG.md

            git add CHANGELOG.md
            git commit -m "docs: CHANGELOG.md for ${TAG} [skip ci]"
            git tag "$TAG"

            # Load-bearing push first: if this fails, nothing is tagged and
            # nothing has touched main -- the run fails cleanly and can be
            # re-run. Only once the tag is safely on origin do we push the
            # cosmetic changelog commit, and that push must not fail the job
            # after a successful release.
            git push origin "$TAG"

            if ! git push origin HEAD:main; then
              echo "::warning::Tag ${TAG} was pushed and the release will proceed, but pushing the CHANGELOG.md commit to main failed (transient network issue or a race with another push to main). No manual fix is required -- the next release's changelog section automatically folds in whatever this one missed. To backfill immediately instead, run: bash scripts/generate-changelog.sh --section --to ${TAG} --header \"## ${TAG} (${DATE})\" and commit the result to main by hand."
            fi
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zirv-windows
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: zirv-linux
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: zirv-macos
          path: artifacts

      - name: Attest Release Assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/zirv-${{ needs.build.outputs.version }}-*

      - name: Create Release with Assets
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.build.outputs.version }}"

          # Immutable releases need assets uploaded while still a draft.
          # Skip published releases so re-runs succeed without changing them.
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$IS_DRAFT" == "false" ]]; then
              echo "::notice::release $TAG is already published; nothing to do"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --title "Release $TAG" --notes-file changelog-section.md
          fi

          gh release upload "$TAG" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-windows.exe" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-windows.exe.sha256" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-linux.tar.gz" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-linux.tar.gz.sha256" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-macos.tar.gz" \
            "artifacts/zirv-${{ needs.build.outputs.version }}-macos.tar.gz.sha256" \
            --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    environment:
      name: homebrew-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Artifact for Homebrew
        uses: actions/download-artifact@v4
        with:
          name: zirv-macos
          path: artifacts

      - name: Download Linux Artifact for Homebrew
        uses: actions/download-artifact@v4
        with:
          name: zirv-linux
          path: artifacts

      - name: Get version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml \
            | head -n1 \
            | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Homebrew Formula
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          chmod +x ./scripts/update_homebrew.sh
          ./scripts/update_homebrew.sh \
            "${{ steps.get_version.outputs.version }}" \
            "artifacts/zirv-${{ steps.get_version.outputs.version }}-macos.tar.gz" \
            "artifacts/zirv-${{ steps.get_version.outputs.version }}-linux.tar.gz"

  update-chocolatey:
    name: Update Chocolatey Package
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    environment:
      name: chocolatey-release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml (Chocolatey)
        id: get_version_choco
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml \
            | head -n1 \
            | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: zirv-windows
          path: artifacts

      - name: Update Chocolatey Package
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          # configure push source
          choco config set --name='defaultPushSource' --value='https://push.chocolatey.org/'

          # grab the version that we exported
          $ver = '${{ steps.get_version_choco.outputs.version }}'
          Write-Host "Releasing version: $ver"

          # construct the artifact filename
          $artifact = "artifacts/zirv-$ver-windows.exe"
          Write-Host "Using artifact: $artifact"

          # call your script
          ./scripts/update_chocolatey.ps1 -Version $ver -ArtifactPath $artifact
  
